name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/live-console
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install Python console runtime
        working-directory: .
        run: uv sync --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/live-console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify packaged frontend is current
        working-directory: .
        run: git diff --exit-code -- src/rtscortex/console/static

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify wheel contains the Live Console
        run: |
          uv build --wheel --out-dir dist
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "rtscortex/console/static/index.html" in names
          assert any(
              name.startswith("rtscortex/console/static/assets/") and name.endswith(".js")
              for name in names
          )
          assert any(
              name.startswith("rtscortex/console/static/assets/") and name.endswith(".css")
              for name in names
          )
          PY
      - run: uv run rtscortex doctor

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.9"
      - run: uv venv --python 3.9 .worker-venv
      - name: Prepare and install the reviewed Worker source
        shell: bash
        run: |
          set -euo pipefail
          reviewed_root="${RUNNER_TEMP}/rtscortex-reviewed-source"
          gitlink="$(git ls-tree HEAD third_party/LLM-PySC2 | awk '{print $3}')"
          .worker-venv/bin/python scripts/prepare_reviewed_llm_pysc2_runtime.py \
            --source third_party/LLM-PySC2 \
            --output-root "${reviewed_root}" \
            --patch-directory integrations/llm_pysc2/patches \
            --expected-gitlink "${gitlink}"
          echo "RTSCORTEX_CI_REVIEWED_SOURCE_ROOT=${reviewed_root}" >> "${GITHUB_ENV}"
          uv pip install --python .worker-venv/bin/python \
            -e integrations/llm_pysc2 \
            -e "${reviewed_root}/third_party/LLM-PySC2"
      - name: Validate reviewed patch chain on Python 3.9
        shell: bash
        run: |
          set -euo pipefail
          reviewed_llm_pysc2="${RTSCORTEX_CI_REVIEWED_SOURCE_ROOT}/third_party/LLM-PySC2"
          .worker-venv/bin/python -m compileall -q \
            integrations/llm_pysc2/src \
            "${reviewed_llm_pysc2}/llm_pysc2"
          PYGAME_HIDE_SUPPORT_PROMPT=1 .worker-venv/bin/python -c \
            "import llm_pysc2.agents, pysc2, rtscortex_llm_pysc2.worker"
          PYGAME_HIDE_SUPPORT_PROMPT=1 .worker-venv/bin/python \
            integrations/llm_pysc2/tests/python39_contract_smoke.py
          PYGAME_HIDE_SUPPORT_PROMPT=1 .worker-venv/bin/python -m unittest discover \
            -s integrations/llm_pysc2/tests -p 'test_*.py' -v

          git -C third_party/LLM-PySC2 diff --exit-code
          test -z "$(git -C third_party/LLM-PySC2 status --short)"
